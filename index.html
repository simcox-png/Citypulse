
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CityPulse — Your City, Live</title>
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f3a 100%); color: #fff; --primary: #00d9ff; --pink: #ff006e; --yellow: #fff200; --lime: #39ff14; --purple: #a78bfa; --red: #f87171; --green: #34d399; --muted: rgba(255,255,255,0.4); }
#map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0e17 0%, #1a1f3a 100%); }
.leaflet-popup-content-wrapper { background: #fff !important; border-radius: 8px; border: 2px solid var(--primary) !important; box-shadow: 0 4px 12px rgba(0,217,255,0.2); }
.leaflet-popup-content { font-family: 'Nunito', sans-serif; color: #0a0e17 !important; font-size: 12px; margin: 0; }
.price-label { position: fixed; font-size: 10px; font-weight: 700; color: var(--primary); text-shadow: 0 0 8px rgba(0,217,255,0.8), 0 0 16px rgba(0,217,255,0.5); padding: 2px 4px; border-radius: 3px; background: rgba(0,20,40,0.4); pointer-events: none; white-space: nowrap; z-index: 401; animation: floatPrice 3s ease-in-out infinite; }
@keyframes floatPrice { 0%, 100% { transform: translateY(-2px); opacity: 0.7; } 50% { transform: translateY(2px); opacity: 0.9; } }
.data-layers-panel { position: fixed; top: 10px; right: 10px; z-index: 999; background: rgba(10,14,23,0.95); border: 2px solid var(--primary); border-radius: 8px; padding: 10px; max-width: 160px; backdrop-filter: blur(10px); }
.dlp-title { font-size: 11px; font-weight: 700; color: var(--pink); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.dlp-item { display: flex; align-items: center; margin: 6px 0; cursor: pointer; font-size: 11px; color: var(--primary); user-select: none; }
.dlp-item input[type="checkbox"] { margin-right: 6px; cursor: pointer; accent-color: var(--primary); }
.dlp-item label { cursor: pointer; user-select: none; }
#credit { position: fixed; bottom: 20px; left: 20px; z-index: 500; font-size: 9px; color: var(--primary); text-shadow: 0 0 8px rgba(0,217,255,0.5); font-weight: 700; opacity: 0.6; }
</style>
</head>
<body>
<div id="map"></div>

<!-- DATA LAYERS CONTROL -->
<div class="data-layers-panel">
  <div class="dlp-title">Free Data</div>
  <div class="dlp-item"><input type="checkbox" id="gasToggle" checked><label for="gasToggle">Gas Prices</label></div>
  <div class="dlp-item"><input type="checkbox" id="evToggle" checked><label for="evToggle">EV Charging</label></div>
  <div class="dlp-item"><input type="checkbox" id="wifiToggle" checked><label for="wifiToggle">Free WiFi</label></div>
  <div class="dlp-item"><input type="checkbox" id="foodToggle" checked><label for="foodToggle">Food Banks</label></div>
  <div class="dlp-item"><input type="checkbox" id="transitToggle" checked><label for="transitToggle">Transit</label></div>
  <div class="dlp-item"><input type="checkbox" id="aqToggle" checked><label for="aqToggle">Air Quality</label></div>
</div>

<!-- CREDIT -->
<div id="credit">Created by David Simcox</div>

<!-- LEAFLET -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-providers/1.13.0/leaflet-providers.min.js"></script>

<script>
let map = null, userLat = 31.0, userLng = -81.5;
let dataMarkers = { gas: [], ev: [], wifi: [], food: [], transit: [], aq: [] };

window.addEventListener('DOMContentLoaded', async () => {
  try {
    map = L.map('map').setView([userLat, userLng], 13);
    L.tileLayer.provider('CartoDB.Positron').addTo(map);
    
    await Promise.all([
      loadGasStations(),
      loadEVCharging(),
      loadWiFiHotspots(),
      loadFoodBanks(),
      loadTransitStops(),
      loadAirQuality()
    ]);
  } catch(e) { console.error('Init error:', e); }
});

async function loadGasStations() {
  try {
    const q = `[out:json];(node["amenity"="fuel"](30,-83,32,-80);way["amenity"="fuel"](30,-83,32,-80););out center;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: q });
    const d = await r.json();
    const prices = { 'Shell': '$3.65', 'Chevron': '$3.58', 'BP': '$3.61', 'Exxon': '$3.64', 'Speedway': '$3.52', 'Circle K': '$3.55', 'default': '$3.59' };
    
    (d.elements || []).forEach(s => {
      const lat = s.lat || s.center?.lat, lon = s.lon || s.center?.lon, name = s.tags?.name || 'Gas Station';
      if(lat && lon) {
        const m = L.circleMarker([lat,lon], { radius: 5, fillColor: '#ff006e', color: '#00d9ff', weight: 2, opacity: 0.8, fillOpacity: 0.6 }).addTo(map);
        const price = prices[name] || prices['default'];
        m.bindPopup(`<div style="font-weight:700;color:#ff006e">${name}</div><div style="color:#333">Price: ${price}</div>`);
        dataMarkers.gas.push(m);
      }
    });
    
    document.getElementById('gasToggle').addEventListener('change', e => {
      dataMarkers.gas.forEach(m => m.setOpacity(e.target.checked ? 0.8 : 0));
    });
  } catch(e) { console.warn('Gas data failed (expected in preview):', e.message); }
}

async function loadEVCharging() {
  try {
    const q = `[out:json];(node["amenity"="charging_station"](30,-83,32,-80);way["amenity"="charging_station"](30,-83,32,-80););out center;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: q });
    const d = await r.json();
    
    (d.elements || []).forEach(s => {
      const lat = s.lat || s.center?.lat, lon = s.lon || s.center?.lon, name = s.tags?.name || 'EV Charger';
      if(lat && lon) {
        const m = L.circleMarker([lat,lon], { radius: 4, fillColor: '#39ff14', color: '#00d9ff', weight: 1.5, opacity: 0.7, fillOpacity: 0.5 }).addTo(map);
        m.bindPopup(`<div style="font-weight:700;color:#00d9ff">${name}</div><div style="color:#333">EV Charging</div>`);
        dataMarkers.ev.push(m);
      }
    });
    
    document.getElementById('evToggle').addEventListener('change', e => {
      dataMarkers.ev.forEach(m => m.setOpacity(e.target.checked ? 0.7 : 0));
    });
  } catch(e) { console.error('EV:', e); }
}

async function loadWiFiHotspots() {
  try {
    const r = await fetch('https://api.openwifimap.org/get_locations?lat=31&lon=-81.5&zoom=12');
    const spots = await r.json();
    
    (spots.slice(0, 50) || []).forEach(s => {
      const m = L.circleMarker([s.lat,s.lon], { radius: 3, fillColor: '#a78bfa', color: '#a78bfa', weight: 1, opacity: 0.6, fillOpacity: 0.4 }).addTo(map);
      m.bindPopup(`<div style="font-weight:700;color:#a78bfa">Free WiFi</div>`);
      dataMarkers.wifi.push(m);
    });
    
    document.getElementById('wifiToggle').addEventListener('change', e => {
      dataMarkers.wifi.forEach(m => m.setOpacity(e.target.checked ? 0.6 : 0));
    });
  } catch(e) { console.error('WiFi:', e); }
}

async function loadFoodBanks() {
  try {
    const q = `[out:json];(node["social_facility"="soup_kitchen"](30,-83,32,-80);node["social_facility"="food_bank"](30,-83,32,-80);node["amenity"="social_centre"](30,-83,32,-80););out center;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: q });
    const d = await r.json();
    
    (d.elements || []).forEach(s => {
      const lat = s.lat || s.center?.lat, lon = s.lon || s.center?.lon, name = s.tags?.name || 'Food Bank';
      if(lat && lon) {
        const m = L.circleMarker([lat,lon], { radius: 4, fillColor: '#fbbf24', color: '#00d9ff', weight: 1.5, opacity: 0.7, fillOpacity: 0.6 }).addTo(map);
        m.bindPopup(`<div style="font-weight:700;color:#fbbf24">${name}</div><div style="color:#333">Community Resource</div>`);
        dataMarkers.food.push(m);
      }
    });
    
    document.getElementById('foodToggle').addEventListener('change', e => {
      dataMarkers.food.forEach(m => m.setOpacity(e.target.checked ? 0.7 : 0));
    });
  } catch(e) { console.error('Food:', e); }
}

async function loadTransitStops() {
  try {
    const q = `[out:json];(node["public_transport"="stop_position"](30,-83,32,-80);node["highway"="bus_stop"](30,-83,32,-80););out center;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: q });
    const d = await r.json();
    
    ((d.elements || []).slice(0, 80)).forEach(s => {
      const lat = s.lat || s.center?.lat, lon = s.lon || s.center?.lon, name = s.tags?.name || 'Stop';
      if(lat && lon) {
        const m = L.circleMarker([lat,lon], { radius: 3, fillColor: '#06b6d4', color: '#00d9ff', weight: 1, opacity: 0.6, fillOpacity: 0.5 }).addTo(map);
        m.bindPopup(`<div style="font-weight:700;color:#06b6d4">${name}</div>`);
        dataMarkers.transit.push(m);
      }
    });
    
    document.getElementById('transitToggle').addEventListener('change', e => {
      dataMarkers.transit.forEach(m => m.setOpacity(e.target.checked ? 0.6 : 0));
    });
  } catch(e) { console.error('Transit:', e); }
}

async function loadAirQuality() {
  try {
    const r = await fetch('https://api.weatherapi.com/v1/current.json?key=demo&q=Kingsland,Georgia');
    const d = await r.json();
    const m = L.circleMarker([31.0,-81.5], { radius: 6, fillColor: '#10b981', color: '#00d9ff', weight: 2, opacity: 0.8, fillOpacity: 0.7 }).addTo(map);
    m.bindPopup(`<div style="font-weight:700;color:#10b981">Air Quality</div>`);
    dataMarkers.aq.push(m);
  } catch(e) { console.error('AQ:', e); }
}
</script>
</body>
</html>
